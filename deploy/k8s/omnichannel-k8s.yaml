---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: omnichannel-demo
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnichannel-be
  namespace: omnichannel-demo
  labels:
    app: omnichannel-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnichannel-be
  template:
    metadata:
      labels:
        app: omnichannel-be
    spec:
      containers:
        - name: omnichannel-be
          # Build local trên server: docker build -t omnichannel-be:latest .
          image: omnichannel-be:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4001"
            # DB: platform-core/postgres (namespace platform-core)
            - name: DATABASE_URL
              value: "postgresql://platform:change-me-pg@postgres.platform-core.svc:5432/omnichannel"
            - name: DB_HOST
              value: "postgres.platform-core.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "platform"
            - name: DB_PASSWORD
              value: "change-me-pg"
            - name: DB_NAME
              value: "omnichannel"
            # Redis: platform-core/redis
            - name: REDIS_URL
              value: "redis://redis.platform-core.svc:6379"
            - name: REDIS_HOST
              value: "redis.platform-core.svc"
            - name: REDIS_PORT
              value: "6379"
            # RabbitMQ: platform-core/rabbitmq
            - name: AMQP_URL
              value: "amqp://platform:change-me-rmq@rabbitmq.platform-core.svc:5672"
            # Notification gRPC (nếu chạy cùng cluster)
            - name: NOTIFICATION_GRPC_URL
              value: "notification-be-rs.platform-core.svc:8081"
            - name: NOTIFICATION_TENANT_ID
              value: "tnt_hawaco"
            # Auth: MVP dev mode (AUTH_ENABLED=false)
            - name: AUTH_ENABLED
              value: "false"
            # Customer 360: chưa có .NET BFF → Mock adapter
            - name: CSKH_BFF_URL
              value: ""
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: omnichannel-be-svc
  namespace: omnichannel-demo
spec:
  selector:
    app: omnichannel-be
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4001
---
# Ingress — wildcard *.dichvunuoc.vn + TLS reuse
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnichannel-be-ingress
  namespace: omnichannel-demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: omnichannel-be-dev.dichvunuoc.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnichannel-be-svc
                port:
                  number: 80
