---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: omnichannel-demo
---
# ConfigMap — config KHÔNG nhạy cảm (hosts/ports/URLs không creds + flags).
# Creds (DATABASE_URL, DB_PASSWORD, AMQP_URL, WEBHOOK_HMAC_SECRET) nằm ở Secret
# `omnichannel-be-secret`, tạo server-side từ env của deployment live (không commit
# giá trị thật vào repo/GitHub). WEBHOOK_HMAC_SECRET = HMAC secret cho /webhooks/*
# (WebhookHmacGuard) — PATCH server-side cùng giá trị CSKH_WEBHOOK_HMAC_SECRET
# của app-tu-phuc-vu (k8s/overlays/demo/secret.yaml).
# Tạo Secret: xem scripts/ hoặc comment dưới Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: omnichannel-be-config
  namespace: omnichannel-demo
data:
  NODE_ENV: "production"
  PORT: "4001"
  # DB (drizzle-kit migrate đọc DB_HOST/PORT/USER/NAME đây + DB_PASSWORD từ Secret)
  DB_HOST: "postgres.platform-core.svc"
  DB_PORT: "5432"
  DB_USER: "platform"
  DB_NAME: "omnichannel"
  # Redis: platform-core/redis (không creds)
  REDIS_URL: "redis://redis.platform-core.svc:6379"
  REDIS_HOST: "redis.platform-core.svc"
  REDIS_PORT: "6379"
  # Notification gRPC (cùng cluster)
  NOTIFICATION_GRPC_URL: "notification-be-rs.platform-core.svc:8081"
  NOTIFICATION_TENANT_ID: "tnt_hawaco"
  # Auth: MVP dev mode (AUTH_ENABLED=false)
  AUTH_ENABLED: "false"
  # Customer 360: chưa có .NET BFF → Mock adapter
  CSKH_BFF_URL: ""
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnichannel-be
  namespace: omnichannel-demo
  labels:
    app: omnichannel-be
spec:
  replicas: 3                       # HA: 3 replica across 2 node (1× tino-32 + 2× tino-12) — khớp state live hiện tại
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0                   # không tạo pod thừa → tránh 2 initContainer migrate chạy song song
      maxUnavailable: 1             # rollout tuần tự (1 pod cũ tắt → 1 pod mới lên)
  selector:
    matchLabels:
      app: omnichannel-be
  template:
    metadata:
      labels:
        app: omnichannel-be
    spec:
      imagePullSecrets:
        # registry-dev-pull: pull-secret canonical của cluster (đã có demo/platform-core,
        # copy sang omnichannel-demo 2026-08-06). Dùng chung cho initContainer + container.
        - name: registry-dev-pull
      # Lan tỏa pod across node — khi tino-32 (control-plane) sập, pod vẫn chạy trên tino-12.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: omnichannel-be
                topologyKey: kubernetes.io/hostname
      # initContainer migrate — auto-run drizzle-kit migrate trước app (idempotent).
      # Baseline 2026-08-06: drizzle.__drizzle_migrations đã seed hash 0000
      # (c07ad2a0… = sha256 raw SQL, verify bằng chính readMigrationFiles của drizzle).
      # drizzle-kit migrate hiện no-op (exit 0, 0 row mới). Khi thêm migration 0002+,
      # initContainer tự apply → __drizzle_migrations theo dõi đúng.
      initContainers:
        - name: migrate
          image: registry-dev.dichvunuoc.vn/omnichannel-be:latest
          imagePullPolicy: Always
          command: ["npx", "drizzle-kit", "migrate"]
          envFrom:
            - configMapRef:
                name: omnichannel-be-config
            - secretRef:
                name: omnichannel-be-secret
      containers:
        - name: omnichannel-be
          image: registry-dev.dichvunuoc.vn/omnichannel-be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: omnichannel-be-config
            - secretRef:
                name: omnichannel-be-secret   # DATABASE_URL, DB_PASSWORD, AMQP_URL — tạo server-side
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: omnichannel-be-svc
  namespace: omnichannel-demo
spec:
  selector:
    app: omnichannel-be
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4001
---
# Ingress — wildcard *.dichvunuoc.vn + TLS reuse
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnichannel-be-ingress
  namespace: omnichannel-demo
spec:
  # Cluster k3s này dùng ingress-nginx (Traefik disabled khi build cluster) —
  # annotation traefik cũ là inert, đã xóa. TLS: wildcard *.dichvunuoc.vn served
  # bởi default-ssl-certificate của ingress-nginx → không cần tls: block.
  ingressClassName: nginx
  rules:
    - host: omnichannel-be-dev.dichvunuoc.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnichannel-be-svc
                port:
                  number: 80
