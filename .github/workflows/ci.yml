name: CI Pipeline

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit Tests
        run: bun run test

      - name: Build Docker Image
        run: docker build -t nestjs-app:${{ github.sha }} .
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nestjs-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ── Push image lên registry nội bộ (chỉ trên push, bỏ qua PR) ──
      # Yêu cầu:
      #  - registry-dev.dichvunuoc.vn phải reachable từ GitHub runner (qua ingress wildcard *.dichvunuoc.vn).
      #    Nếu registry chỉ internal (không expose ra internet), dùng fallback build+push từ water-dev
      #    bằng scripts/build-push.sh — CI push sẽ fail ở bước login.
      #  - Repo secrets: REGISTRY_USER, REGISTRY_PASS (creds docker login từ admin).
      - name: Login to internal registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login registry-dev.dichvunuoc.vn -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Push image to internal registry
        if: github.event_name == 'push'
        run: |
          docker tag nestjs-app:${{ github.sha }} registry-dev.dichvunuoc.vn/omnichannel-be:${{ github.sha }}
          docker tag nestjs-app:${{ github.sha }} registry-dev.dichvunuoc.vn/omnichannel-be:latest
          docker push registry-dev.dichvunuoc.vn/omnichannel-be:${{ github.sha }}
          docker push registry-dev.dichvunuoc.vn/omnichannel-be:latest
